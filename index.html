<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { 
      font-family: Georgia; 
      background: #f4f4f9; 
      display: flex;
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px;
      box-sizing: border-box;
    }
    .top-image {
      display: block;
      margin: 0 auto 15px auto;
      width: 200px;
      height: 150px;
    }
    .login-card { 
      margin-top: -15px;
      background: white; 
      padding: 30px; 
      border-radius: 24px; 
      border: 2px solid #333;
      box-shadow: 0 8px 0px rgba(0,0,0,0.9); 
      width: 100%; 
      max-width: 400px;
      text-align: center;
      box-sizing: border-box;
    }
    input { 
      width: 100%; 
      padding: 10px 5px; 
      margin-bottom: 20px; 
      border: none; 
      border-bottom: 2px solid #ccc; 
      text-align: center;
      outline: none;
      box-sizing: border-box;
    }
    button { 
      width: 50%; 
      padding: 10px; 
      background: #fff; 
      border: 2px solid #333; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: bold;
      box-shadow: 0 3px 0px #333;
    }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0px #333; }
    #message { margin-top: 15px; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body> 
  <marquee style="font-style:italic;margin-bottom:10px">*This project was only a prototype develop by: Mark Jake*</marquee>
  <img class="top-image" src="login.png" alt="Login Image">
  
  <div class="login-card">
    <h2>NEAR EX PROJECT</h2>
    <h3>LOG IN</h3>
    
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    
    <button onclick="handleLogin()">Login</button>
    <div id="message"></div>
  </div>

  <script>
    function handleLogin() {
      var user = document.getElementById('username').value;
      var pass = document.getElementById('password').value;
      var msgDiv = document.getElementById('message');
      
      msgDiv.style.color = '#666';
      msgDiv.innerText = 'Checking...';

      var scriptURL = 'https://script.google.com/macros/s/AKfycbwkDjXXLwfGRHkdkMlp2P94cZm6iXX4n0yJdCfbDkTffadNvsRkrDk09v0cyF_ALRyWNQ/exec'; 

      var targetURL = scriptURL + '?username=' + encodeURIComponent(user) + '&password=' + encodeURIComponent(pass);

      fetch(targetURL)
        .then(response => response.json())
        .then(result => {
          if (result.success) {
            msgDiv.style.color = 'green';
            msgDiv.innerText = result.message + ' Redirecting...';
            setTimeout(function() {
              window.location.href = 'portal.html'; 
            }, 1000);
          } else {
            msgDiv.style.color = 'red';
            msgDiv.innerText = result.message;
          }
        })
        .catch(error => {
          msgDiv.style.color = 'red';
          msgDiv.innerText = 'Connection error. Try again.';
        });
    }
  </script>
</body>
</html>
