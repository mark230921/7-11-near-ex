<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>admin</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Georgia;
    }
    .floating-btn {
      /* Fixed dimensions */
      width: 50px;
      height: 50px;
      
      position: fixed;       /* Anchors the button to the viewport */
      bottom: 10px;          /* Distance from the bottom of the screen */
      right: 10px;           /* Distance from the right of the screen */
      
      background: #ffffff;   /* Button background color */
      color: #333;           /* Text/icon color */
      
      border: 2px solid #333;/* Border */
      border-radius: 50%;    /* Makes it a perfect circle */
      
      font-size: 36px;       /* Controlled emoji size */
      font-weight: bold;
      
      cursor: pointer;       /* Pointer cursor on hover */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); /* Adds a shadow for depth */
      z-index: 1000;
      
      /* Centers the emoji inside the fixed button */
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url('exit.png'); /* Replace with your image file/URL */
      background-size: cover;                  /* Ensures the image fills the button */
      background-position: center;             /* Centers the image */
      background-repeat: no-repeat;    
      
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    .floating-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    iframe {
      border: none;
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <button class="floating-btn" onclick="window.location.href='portal.html';"></button>
  
  <iframe src="https://script.google.com/macros/s/AKfycbwN7TDKs8IMfoFp2-Ypfdwg29P-WCa94IBE3s6IwJuIvkI5kOw26KcQQVM70bhA4WjXmA/exec"></iframe>    
</body>
</html>
